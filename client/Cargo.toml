[package]
name = "client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bayronik egui + WASM frontend"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["image"] }
egui_plot = "0.34"
ehttp = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.77", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }
console_error_panic_hook = "0.1"
js-sys = "0.3.77"
getrandom = { version = "0.3", features = ["wasm_js"] }
engine = { path = "../engine", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[profile.release-wasm]
inherits = "release"
opt-level = "s"
strip = true

# wasm-pack's bundled wasm-opt rejects bulk-memory ops emitted by recent
# rustc/llvm. We rely on `opt-level = "s"` + `strip = true` for size; skip
# the post-link wasm-opt pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

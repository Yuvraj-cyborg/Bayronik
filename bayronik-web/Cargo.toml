[package]
name = "bayronik-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "WebAssembly frontend for Bayronik baryonic field emulator"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bayronik-web"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["image"] }
egui_plot = "0.34"
ehttp = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.77", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }
console_error_panic_hook = "0.1"
js-sys = "0.3.77"
getrandom = { version = "0.3", features = ["wasm_js"] }
bayronik-core = { path = "../bayronik-core", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[profile.release]
opt-level = 2
lto = true

[profile.release-wasm]
inherits = "release"
opt-level = "s"
strip = true

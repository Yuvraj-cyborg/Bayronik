[workspace]
resolver = "2"
members = ["engine", "infer", "registry", "server", "client"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Yuvraj Biswal <yuvrajbiswalofficial@gmail.com>"]
license = "MIT"
repository = "https://github.com/cosmexus/bayronik"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

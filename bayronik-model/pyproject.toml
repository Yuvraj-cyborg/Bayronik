[project]
name = "bayronik-model"
version = "0.1.0"
description = "Baryonic feedback emulator for weak lensing"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
train = ["torchvision>=0.15.0", "psutil>=5.9.0"]
wandb = ["wandb>=0.15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bayronik_model"]

[package]
name = "bayronik-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["npy"]
npy = ["dep:ndarray-npy"]

[dependencies]
anyhow = "1.0"
ndarray = "0.16.1"
ndarray-npy = { version = "0.9.1", optional = true }
num-complex = "0.4.6"
rand = "0.9.2"
rand_distr = "0.5.1"
rustfft = "6.4.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
